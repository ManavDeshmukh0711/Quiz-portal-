<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Learning & Quiz Portal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🎓 LearnQuiz Portal</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 mx-auto">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h3 class="card-title text-primary mb-4">
                            Web Development Basics Quiz
                        </h3>

                        <form id="quizForm">

                            <!-- Student Name -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Enter Your Name:
                                </label>
                                <input type="text"
                                       id="studentName"
                                       class="form-control"
                                       placeholder="Enter your name"
                                       required>
                            </div>

                            <hr>

                            <!-- Question 1 -->
                            <div class="mb-4">
                                <p class="fw-semibold">
                                    1. Which language is used for styling web pages?
                                </p>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="q1"
                                           value="HTML"
                                           required>
                                    <label class="form-check-label">HTML</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="q1"
                                           value="CSS">
                                    <label class="form-check-label">CSS</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="q1"
                                           value="Python">
                                    <label class="form-check-label">Python</label>
                                </div>
                            </div>

                            <!-- Question 2 -->
                            <div class="mb-4">
                                <p class="fw-semibold">
                                    2. Which tag is used for the largest heading in HTML?
                                </p>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="q2"
                                           value="h1"
                                           required>
                                    <label class="form-check-label">&lt;h1&gt;</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="q2"
                                           value="head">
                                    <label class="form-check-label">&lt;head&gt;</label>
                                </div>

                                <div class="form-check">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="q2"
                                           value="h6">
                                    <label class="form-check-label">&lt;h6&gt;</label>
                                </div>
                            </div>

                            <button type="submit"
                                    class="btn btn-primary w-100 fs-5">
                                Submit Quiz
                            </button>

                        </form>

                        <!-- Result -->
                        <div id="resultMessage"
                             class="alert alert-success mt-4 d-none text-center">
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="js/script.js"></script>

</body>
</html>
